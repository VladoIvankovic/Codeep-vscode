name: Release

# Triggered when a tag matching v*.*.* is pushed. The job builds, type-checks,
# packages the extension, publishes to the VS Code Marketplace, and creates a
# GitHub Release with the .vsix attached and notes pulled from CHANGELOG.md.
#
# Required repository secrets:
#   VSCE_PAT   — Marketplace Personal Access Token, scope "Marketplace: Manage"
#
# Manual trigger (workflow_dispatch) is also exposed for re-runs without
# pushing a new tag.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.27)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for creating GitHub Releases
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.tag }}"
          else
            REF="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${REF#v}"
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Verify tag matches package.json version
        # Passed via env, not interpolated into the script body: on the
        # workflow_dispatch path these derive from user input, and this job holds
        # contents:write plus VSCE_PAT.
        env:
          TAG_VERSION: ${{ steps.ver.outputs.version }}
          TAG_NAME: ${{ steps.ver.outputs.tag }}
        run: |
          # vsce packages whatever package.json says, regardless of --out. A tag
          # that disagrees would ship the previous version's bits and then get
          # rejected by the Marketplace as a duplicate — fail here instead.
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG" ]; then
            echo "::error::Tag $TAG_NAME does not match package.json version $PKG. Aborting release."
            exit 1
          fi

      # `npm install` (not `npm ci`): esbuild's per-platform optional deps make
      # a macOS-generated lockfile fail `npm ci` on Linux (EBADPLATFORM). install
      # skips platform-mismatched optionals.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package extension
        run: npx vsce package --out "codeep-${{ steps.ver.outputs.version }}.vsix"

      - name: Extract CHANGELOG section
        id: notes
        run: |
          # Pull the section between "## [VERSION]" and the next "## [" header.
          # If no entry is found, fall back to a minimal placeholder so the
          # release still gets created.
          awk -v v="${{ steps.ver.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog entry for v${{ steps.ver.outputs.version }} — using fallback." >&2
            echo "Release ${{ steps.ver.outputs.tag }}." > release-notes.md
          fi
          cat release-notes.md

      # Makes re-tagging safe. The Marketplace refuses a duplicate version, so
      # without this a tag for something already published fails the whole run —
      # which is what stopped v2.7.0 (published by hand, never tagged) from
      # being backfilled. Query first, skip the publish, still cut the release.
      - name: Check whether this version is already on the Marketplace
        id: published
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          versions=$(curl -sS -X POST \
            'https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json;api-version=3.0-preview.1' \
            -d '{"filters":[{"criteria":[{"filterType":7,"value":"VladoIvankovic.codeep"}]}],"flags":16}' \
            | tr ',' '\n' | grep -o '"version":"[^"]*"' | cut -d'"' -f4 || true)
          if printf '%s\n' "$versions" | grep -qx "$VERSION"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$VERSION is already on the Marketplace — skipping publish, still creating the GitHub Release."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to VS Code Marketplace
        if: steps.published.outputs.already != 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "codeep-${{ steps.ver.outputs.version }}.vsix"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes-file release-notes.md \
            "codeep-${{ steps.ver.outputs.version }}.vsix"
